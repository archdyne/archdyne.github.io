<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b12" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found — Ateek Rahman</title>
    <style>
      :root { color-scheme: dark; --page: #080b12; --text: #f3f6fb; --muted: #b6c1d2; --accent: #82dcff; --accent-strong: #45a8e8; --on-accent: #080b12; }
      @media (prefers-color-scheme: light) { :root { color-scheme: light; --page: #f8fafc; --text: #172033; --muted: #475569; --accent: #4f46e5; --accent-strong: #4338ca; --on-accent: #ffffff; } }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: var(--text); background: var(--page); font: 400 16px/1.6 Inter, system-ui, sans-serif; text-align: center; }
      main { max-width: 520px; }
      .brand { display: inline-flex; align-items: center; gap: 10px; font: 600 16px/1.2 "Plus Jakarta Sans", system-ui, sans-serif; }
      .monogram { color: var(--accent); }
      h1 { margin: 26px 0 12px; color: var(--accent-strong); font: 600 clamp(72px, 18vw, 128px)/1.2 "Plus Jakarta Sans", system-ui, sans-serif; letter-spacing: -.02em; }
      p { color: var(--muted); font-size: 16px; line-height: 1.7; }
      a { display: inline-flex; margin-top: 20px; padding: 13px 20px; border-radius: 8px; background: var(--accent-strong); color: var(--on-accent); font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <span class="brand"><span class="monogram">AR</span> Ateek Rahman</span>
      <h1>404</h1>
      <p>This page isn't in the system. Let's get you back to somewhere useful.</p>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
